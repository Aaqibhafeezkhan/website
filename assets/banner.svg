<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="got-a.page - Everyone's got a page">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset="1" stop-color="#ffe3c8"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff922b"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a35c1f" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#f0cba4"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>
  <rect x="830" y="0" width="370" height="300" fill="url(#dots)" opacity="0.55"/>
  <!-- wordmark -->
  <g font-family="Verdana, DejaVu Sans, sans-serif">
    <text x="80" y="138" font-size="68" font-weight="bold" fill="#3b2314" letter-spacing="-1">got-a<tspan fill="#e8590c">.page</tspan></text>
    <text x="82" y="190" font-size="29" fill="#8a6247">Everyone's got a page.</text>
    <text x="82" y="232" font-size="19" fill="#a97c5b">Free community subdomains - claim yours with one pull request.</text>
  </g>
  <!-- logo mark -->
  <g transform="translate(884,84)" filter="url(#soft)">
    <rect width="132" height="132" rx="30" fill="url(#mark)"/>
    <path d="M41 33 h30 l17 17 v43 a6.5 6.5 0 0 1 -6.5 6.5 H41 a6.5 6.5 0 0 1 -6.5 -6.5 V39.5 a6.5 6.5 0 0 1 6.5 -6.5 z" fill="#fffaf3"/>
    <path d="M71 33 l17 17 h-13.5 a3.5 3.5 0 0 1 -3.5 -3.5 v-13.5 z" fill="#ffd8b5"/>
    <rect x="44" y="59" width="32" height="5" rx="2.5" fill="#e8590c"/>
    <rect x="44" y="69" width="41" height="4" rx="2" fill="#f3dcc8"/>
    <rect x="44" y="77" width="41" height="4" rx="2" fill="#f3dcc8"/>
    <rect x="44" y="85" width="26" height="4" rx="2" fill="#f3dcc8"/>
  </g>
  <!-- mock page card -->
  <g transform="translate(1032,58) rotate(3)" filter="url(#soft)">
    <rect width="150" height="184" rx="14" fill="#ffffff"/>
    <rect x="18" y="18" width="34" height="34" rx="17" fill="#ffe0c2"/>
    <rect x="18" y="66" width="114" height="12" rx="6" fill="#e8590c"/>
    <rect x="18" y="90" width="114" height="9" rx="4.5" fill="#f0d9c4"/>
    <rect x="18" y="108" width="96" height="9" rx="4.5" fill="#f0d9c4"/>
    <rect x="18" y="126" width="104" height="9" rx="4.5" fill="#f0d9c4"/>
    <rect x="18" y="150" width="66" height="18" rx="9" fill="#3b2314"/>
  </g>
</svg>
